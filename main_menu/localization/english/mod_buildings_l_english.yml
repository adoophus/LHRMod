l_english: 
  hes_hofkanzlei: "Hofkanzlei"
  hes_hofkanzlei_desc: "This consolidated court building serves as the heart of Hessian state administration, housing both the Landgrave's civil administration and war administration. Staffed primarily by the noble class, this institution is dedicated to raising the standard of our infantry and ensuring favorable contracts and management for the local mercenary companies."
  scan_early_dockyard: "Vikingarvet"
  scan_early_dockyard_desc: "A local shipyard focused on sturdy, clinker-built vessels, carrying forward the long-established Nordic tradition of sea-faring."
  ira_gateway: "Persian Gateway"
  ira_gateway_desc: "These imperial gatehouses are anchored into the bedrock of vital mountain passes. By controlling these strategic arteries, the state secures regional logistics, taxes, high-altitude trade, projecting central authority into the most rugged reaches of Persia."

  lhr_muster_office: "Muster Office"
  lhr_muster_office_desc: "A local administrative office that maintains the records of military obligations, tracks eligible recruits, and organises troop movement across the surrounding area. By formalising these duties, the state extends its bureaucratic reach over local forces and sustains a larger military apparatus."
  lhr_muster_office_maintenance: "Muster Administration"

  lhr_muster_hall: "Muster Hall"
  lhr_muster_hall_desc: "A dedicated hall where city authorities formally register military obligations, conduct reviews of eligible men, and coordinate with state officials on recruitment. The Muster Hall brings order and administrative rigour to the city's military obligations, meaningfully expanding national military capacity."
  lhr_muster_hall_maintenance: "Muster Administration"

  lhr_grand_military_college: "Grand Military College"
  lhr_grand_military_college_desc: "A prestigious institution dedicated to the art and science of warfare. The Grand Military College trains officers, develops military doctrine, and organizes state-wide recruitment, significantly expanding the nation's military capacity."
  lhr_grand_military_college_maintenance: "Military Operations"