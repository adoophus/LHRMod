STATIC_MODIFIER_NAME_lhr_over_military_capacity: "Over Military Capacity"
STATIC_MODIFIER_DESC_lhr_over_military_capacity: "This nation's army exceeds its Military Capacity. Army maintenance costs are increased proportionally to how far over the limit the army is."

