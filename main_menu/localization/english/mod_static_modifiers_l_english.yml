 STATIC_MODIFIER_NAME_societal_value_push_unitary: "Societal Push for $unitary_focus$"
 STATIC_MODIFIER_NAME_societal_value_push_federalism: "Societal Push for $federalism_focus$"
 STATIC_MODIFIER_NAME_hes_reduce_inflation: "Hessian Economic Stability"
 STATIC_MODIFIER_NAME_hes_religious_rights_protected: "Ecclesiastical Guarantees"

STATIC_MODIFIER_NAME_hes_accepted_noble_concessions: "Costly Compromise of the Landgrave"
STATIC_MODIFIER_DESC_hes_accepted_noble_concessions: "By paying a massive indemnity, the Landgrave has secured the loyalty of the nobles and successfully restructured their military obligations. While financially painful, the foundations for a more professional military system have been laid, paving the way for later centralized reforms."

STATIC_MODIFIER_NAME_hes_refused_noble_concessions: "Stubborn Refusal"
STATIC_MODIFIER_DESC_hes_refused_noble_concessions: "The Landgrave's refusal to concede to the demands of the Sternerbund was a show of great prestige and defiance, but it has shattered the peace. The nobility remain deeply dissatisfied and openly challenge the Landgrave's authority, making any future attempts at centralization difficult until this dissent is dealt with."

STATIC_MODIFIER_NAME_hes_holy_water_supported: "Blessing of Purification"
STATIC_MODIFIER_DESC_hes_holy_water_supported: "The Landgrave's support for the popular, faith-driven handwashing ritual has brought psychological and accidentally hygienic benefits to the populace. While this greatly calms the population and reduces the spread of pestilence, the clerical authorities remain deeply offended by the profane use of consecrated water."

STATIC_MODIFIER_NAME_hes_land_age_2: "Iron Hedges"
STATIC_MODIFIER_DESC_hes_land_age_2: "A vast system of defensive earthworks and hedges now encloses the Landgraviate. While this physically consolidates our territory and secures the border, the nobility deeply resents this encroachment on their traditional local autonomy."

STATIC_MODIFIER_NAME_hes_land_age_3: "Urban-Funded Consolidation"
STATIC_MODIFIER_DESC_hes_land_age_3: "The Landgrave is aggressively purchasing noble estates using forced loans and heavy taxes levied on the cities. This rapid territorial expansion has alienated both the Burghers, who pay the price, and the Nobles, who lose their ancestral lands."

# Static Modifier
STATIC_MODIFIER_NAME_hes_morale_age_3: "Hessian Vanguards"
STATIC_MODIFIER_DESC_hes_morale_age_3: "Gott mit uns."

# Static Modifier
STATIC_MODIFIER_NAME_hes_erosion_of_trust: "Erosion of Trust"
STATIC_MODIFIER_DESC_hes_erosion_of_trust: "Following the exposure of the currency fraud, the Landgrave's reputation as a reliable financial actor has been severely damaged. Merchants across the Empire now view Hessian coinage with suspicion, and the Crown's credit is significantly diminished."

STATIC_MODIFIER_NAME_bds_ayyar_bands: "Ayyar Banditry"
STATIC_MODIFIER_DESC_bds_ayyar_bands: "In the Ilkhanate's aftermath, armed ayyar bands and local strongmen dominate roads and markets, undermining central authority."

STATIC_MODIFIER_NAME_bds_ilkhanate_power_vacuum: "Ilkhanate Power Vacuum"
STATIC_MODIFIER_DESC_bds_ilkhanate_power_vacuum: "With Ilkhanid authority shattered, successor states struggle to enforce taxation, law, and loyalty across Iraq-i Ajam."

STATIC_MODIFIER_NAME_giving_market_knowledge_sharing: "Sharing Knowledge"
STATIC_MODIFIER_NAME_receiving_market_knowledge_sharing: "Receiving Knowledge"
STATIC_MODIFIER_NAME_hes_peasant_disenfranchisement: "Peasant Disenfranchisement"
STATIC_MODIFIER_DESC_hes_peasant_disenfranchisement: "New local statutes restrict peasant political participation and transfer leverage back to the landed nobility."
STATIC_MODIFIER_NAME_hes_korbach_peasant_enfranchisement: "Korbach Peasant Enfranchisement"
STATIC_MODIFIER_DESC_hes_korbach_peasant_enfranchisement: "Emergency mining ordinances at Korbach elevate peasant leverage in local governance and labor bargaining."
STATIC_MODIFIER_NAME_hes_joint_investment_nobility_kassel: "Joint Investment Concessions"
STATIC_MODIFIER_DESC_hes_joint_investment_nobility_kassel: "Noble financiers receive enhanced local influence in Kassel as part of a major urban investment compact."
STATIC_MODIFIER_NAME_hes_noble_pension_compacts: "Noble Pension Compacts"
STATIC_MODIFIER_DESC_hes_noble_pension_compacts: "The Landgrave secures temporary elite cooperation through stipends and guarantees, at the cost of renewed aristocratic influence."
STATIC_MODIFIER_NAME_lhr_chi_permanent_nerf: "No Father"
STATIC_MODIFIER_DESC_lhr_chi_permanent_nerf: "No father. No guidance. Only decline."
STATIC_MODIFIER_NAME_lhr_natural_selection: "Not Enough Rice"
STATIC_MODIFIER_DESC_lhr_natural_selection: "Too many blokes to feed and i want my tick speed back so fk off"

game_concept_lhr_military_capacity: "Military Capacity"
game_concept_lhr_military_capacity_desc: "This can be increased through buildings, government reforms, laws, and other modifiers that provide the [lhr_military_capacity|e] modifier.\n\n#bold #w Overcap Penalty#! #!\nIf your army exceeds your Military Capacity, [army_maintenance|e] costs begin to increase. The further over the limit your army is, the steeper the penalty becomes."

game_concept_lhr_army_size: "Army Size"
game_concept_lhr_army_size_desc: "Army Size represents the current number of troops your nation has deployed. It is influenced by recruitment, attrition, and other factors.\n\nWhen your army exceeds your Military Capacity, [army_maintenance|e] costs increase proportionally to how far over the limit you are — the further over the cap, the steeper the penalty."

LHR_MILITARY_CAPACITY_TOOLTIP: "[lhr_military_capacity|e] represents the maximum number of troops your nation can field administratively. Exceeding this limit imposes penalties on [army_maintenance|e]."
