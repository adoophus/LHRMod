l_english:
 lhr_muster_office_advance: "Regional Muster System"
 lhr_muster_office_advance_desc: "Establishing a formal system of Muster Offices in towns across the realm brings the army under centralised administrative control. By recording military obligations and managing recruitment locally, the state can sustain a substantially larger military establishment."

 lhr_muster_hall_advance: "Muster Halls"
 lhr_muster_hall_advance_desc: "Constructing dedicated Muster Halls in cities formalises the review and registration of military obligations at the heart of the realm's urban centres. This administrative investment in the army substantially expands the nation's military capacity."

 hun_border_fortress_system: "Border Fortress System"
 hun_border_fortress_system_desc: "Hungary's southern marches cannot be defended by a handful of great castles alone. By organizing a wider chain of royal border strongholds, captaincies, and permanently maintained garrison points, the crown can harden the frontier in depth."
 tur_kapikulu_corps: "Kapikulu Corps"
 tur_kapikulu_corps_desc: "The kapikulu are the sultan's permanent household army, staffed through the devşirme levy that conscripts promising youth from the Christian provinces of the Balkans. Trained exclusively for war and paid directly from the imperial treasury, the janissaries and their accompanying cavalry regiments form a standing force of a size that no rival can match."

 fra_compagnies_ordonnance: "Compagnies d'Ordonnance"
 fra_compagnies_ordonnance_desc: "The Grandes Ordonnances of 1445 by Charles VII establish permanent royal cavalry companies, paid directly by the crown and subject to strict royal discipline. This became the first standing cavalry force in French history rather than a feudal muster. Three years later, the francs-archers levy followed: the first national infantry obligation, mustering one bowman for every fifty hearths. Together these reforms transform France into one with a true national army."

 hab_militargrenze: "Militärgrenze"
 hab_militargrenze_desc: "Thousands of Grenzer soldier-settlers hold their lands in exchange for permanent frontier service, defending their homesteads without treasury pay. Generation after generation raised in arms and drilled for the Ottoman threat, the Grenzer represent a self-sustaining military caste that substantially expands the Monarchy's total military establishment at negligible cost to the crown."

 mos_dvoryanstvo_service: "Sluzhiloe Dvorianstvo"
 mos_dvoryanstvo_service_desc: "Muscovy's service-estate system binds more of the lesser nobility directly to the Grand Prince through conditional landholding and military duty. As this \"Sluzhiloe Dvorianstvo\" expands, more landholders are expected to appear equipped and ready for service. It gives Muscovy a broader and more reliable military base than a loose feudal levy alone."

 swe_indelningsverket_system: "Indelningsverket Allotment System"
 swe_indelningsverket_system_desc: "The Swedish crown increasingly binds rural communities to the upkeep of soldiers, a system that later matures into the full indelningsverket. Groups of farms are made responsible for maintaining one infantryman and his croft, while cavalry service is supported through rusthall holdings on similar principles. This shifts much of the burden of maintaining troops away from the royal treasury while preserving a trained, locally rooted military establishment, allowing Sweden to mobilize and replace soldiers on a scale out of proportion to its population."

 nap_royal_army_reorganization: "Royal Army Reorganization"
 nap_royal_army_reorganization_desc: "The Kingdom of Naples has long been weakened by magnate autonomy and fractured military authority. By crushing the barons and bringing armed service more firmly under royal administration, the crown can transform scattered aristocratic followings into a broader and more reliable military establishment."

 dlh_service_nobility_host: "Service Nobility Host"
 dlh_service_nobility_host_desc: "The Delhi Sultanate rules through a military elite of Turkic, Afghan, and Indo-Muslim officers bound to the throne by patronage, revenue assignments, and personal service. So long as these warrior households remain tied to the court, the Sultan can summon a military following far larger than what crown lands alone could support, giving Delhi a depth of mobilization unmatched by most of its neighbors."

 mal_manden_military_obligations: "Manden Military Obligations"
 mal_manden_military_obligations_desc: "The military power of Mali rests not only on royal retainers, but on a layered system of provincial levies, sofa garrisons, and elite mounted warriors raised through long-established obligations within Manden society. By enforcing and regularizing those obligations, the mansa can draw on an exceptionally wide pool of fighting men, sustaining an army on a scale few other West African states can rival."